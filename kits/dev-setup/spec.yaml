schemaVersion: "2"
kind: mixin
name: dev-environment-setup
version: v0.1.0
displayName: Dev environment setup
description: Configures and provides an automatic dev environment for the project.

setup:
  startup:
    - command:
        [
          "sh",
          "-c",
          "until [ -f $WORKSPACE_DIR/package.json ]; do sleep 1; done; cd $WORKSPACE_DIR && npm install" 
        ]
      description: Waiting for project files, installing dependencies
    - command:
        [
          "sh",
          "-c",
          "until [ -f $WORKSPACE_DIR/package.json ]; do sleep 1; done; cd $WORKSPACE_DIR && npm run dev",
        ]
      background: true
      description: Start the dev server

permissions:
  network:
    allow:
      - registry.npmjs.org

agentInstructions:
  content: |
    ## Dev environment

    The dev environment is already up and running and accessible on port 3000 inside the sandbox (using http://localhost:3000). 

    Use this for any validation or confirmation you need to do. You can also use the dev server to test your changes in the project.

    The dev server's port is published to the host machine, allowing the user to also access the dev server
    from their local machine. The dev server is accessible to the user at http://localhost:3000.

