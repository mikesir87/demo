schemaVersion: "2"
kind: mixin
name: dev-environment-setup
version: v0.1.0
displayName: Dev environment setup
description: Configures and provides an automatic dev environment for the project.

setup:
  install:
    - command:
        [ "hermes", "skills", "trust", "$WORKSPACE_DIR" ]
      description: Configure hermes to trust the workspace directory
    - command:
        [ "hermes", "config", "set", "skills.create_dir", "$WORKSPACE_DIR/.hermes/skills" ]
      description: Configure hermes to create new skills in the project workspace
  startup:
    - command:
        [
          "sh",
          "-c",
          "until [ -f $WORKSPACE_DIR/compose.yaml ]; do sleep 1; done; cd $WORKSPACE_DIR && docker compose up --build",
        ]
      background: true
      description: Start the dev server via Docker Compose

permissions:
  network:
    allow:
      - registry.npmjs.org

agentInstructions:
  content: |
    ## Dev environment

    The dev environment is started via Docker Compose (`compose.yaml` in the project root) rather than
    `npm run dev` directly. It is already up and running and accessible on port 3000 inside the sandbox
    (using http://localhost:3000).

    Use `docker compose ps` / `docker compose logs -f` to check on the stack, and `docker compose restart`
    if you need to restart it. Use the running server for any validation or confirmation you need to do.

    The dev server's port is published to the host machine, allowing the user to also access the dev server
    from their local machine. The dev server is accessible to the user at http://localhost:3000.

